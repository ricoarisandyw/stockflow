services:
  app:
    image: node:22-bookworm-slim
    container_name: stockflow_app
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:-stockflow-production-jwt-secret-key-32chars}
      - TAX_RATE_PERCENT=${TAX_RATE_PERCENT:-11}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends python3 make g++ openssl ca-certificates &&
             corepack enable &&
             pnpm install &&
             pnpm db:setup &&
             pnpm build &&
             pnpm start -p 3000"
